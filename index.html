<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f6f7f9" />
  <title>Contacts</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="shell">
    <main>
      <div class="intro">
        <div><p class="eyebrow">Phone</p><h1>Contacts</h1><p class="subhead">Keep your important people in one place.</p></div>
        <div class="count" id="count">Loading contacts…</div>
      </div>
      <div class="notice" id="notice" role="status" aria-live="polite"><span class="symbol" id="notice-symbol"></span><span id="notice-text"></span></div>
      <div class="layout">
        <section class="panel list-panel" aria-label="Contact list">
          <div class="list-head"><h2>All contacts</h2><label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="search" type="search" placeholder="Search contacts…" aria-label="Search contacts"></label></div>
          <div class="rows" id="rows" aria-live="polite"></div>
        </section>
        <aside class="panel side">
          <div class="form-title"><h2 id="form-heading">Add a contact</h2></div>
          <p class="form-subtitle" id="form-subtitle">Add someone new to your directory.</p>
          <form id="contact-form" novalidate>
            <label class="field"><span>First name</span><input id="firstName" name="firstName" autocomplete="given-name" placeholder="e.g. Enteng" required maxlength="40"></label>
            <label class="field"><span>Last name</span><input id="lastName" name="lastName" autocomplete="family-name" placeholder="e.g. Kabishawty" required maxlength="40"></label>
            <label class="field"><span>Email address</span><input id="email" name="email" type="email" autocomplete="email" placeholder="entengk@example.com" required maxlength="100"></label>
            <label class="field"><span>Company</span><input id="company" name="company" autocomplete="organization" placeholder="Company name" maxlength="80"></label>
            <label class="field"><span>Phone</span><input id="phone" name="phone" type="tel" autocomplete="tel" placeholder="+1 555 0100" maxlength="30"></label>
            <div class="form-error" id="form-error" role="alert"></div>
            <div class="form-actions"><button class="btn primary" id="submit-button" type="submit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14m-7-7h14"/></svg><span>Add contact</span></button><button class="btn secondary" id="cancel-button" type="button" hidden>Cancel</button></div>
          </form>
        </aside>
      </div>
  <script>
    const API_URL = '/api/users';
    const rows = document.querySelector('#rows');
    const form = document.querySelector('#contact-form');
    const notice = document.querySelector('#notice');
    const formError = document.querySelector('#form-error');
    const submitButton = document.querySelector('#submit-button');
    const cancelButton = document.querySelector('#cancel-button');
    let contacts = [];
    let editingId = null;
    let noticeTimer;

    function escapeHtml(value = '') {
      return String(value).replace(/[&<>"']/g, char => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[char]));
    }
    function showNotice(message, type = 'success') {
      clearTimeout(noticeTimer);
      notice.className = `notice show ${type}`;
      document.querySelector('#notice-symbol').textContent = type === 'success' ? '✓' : type === 'error' ? '!' : 'i';
      document.querySelector('#notice-text').textContent = message;
      noticeTimer = setTimeout(() => notice.classList.remove('show'), 6500);
    }
    function hideNotice() { notice.classList.remove('show'); clearTimeout(noticeTimer); }
    function setFormBusy(busy, label) {
      submitButton.disabled = busy;
      submitButton.innerHTML = busy ? `<span class="spinner"></span><span>${label}</span>` : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14m-7-7h14"/></svg><span>${editingId ? 'Save changes' : 'Add contact'}</span>`;
      cancelButton.disabled = busy;
    }
    function showFormError(message) { formError.textContent = message; formError.classList.add('show'); }
    function clearFormError() { formError.textContent = ''; formError.classList.remove('show'); }
    function render() {
      const query = document.querySelector('#search').value.trim().toLowerCase();
      const matches = contacts.filter(person => `${person.firstName} ${person.lastName} ${person.email} ${person.company?.name || ''}`.toLowerCase().includes(query));
      document.querySelector('#count').textContent = `${contacts.length} ${contacts.length === 1 ? 'contact' : 'contacts'}`;
      if (!matches.length) {
        rows.innerHTML = `<div class="empty"><div class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></div><strong>${query ? 'No matching contacts' : 'No contacts yet'}</strong><span>${query ? 'Try another name, email, or company.' : 'Add a contact with the form to get started.'}</span></div>`;
        return;
      }
      rows.innerHTML = matches.map(person => {
        const name = `${person.firstName || ''} ${person.lastName || ''}`.trim();
        const initials = `${person.firstName?.[0] || ''}${person.lastName?.[0] || ''}`.toUpperCase();
        const company = person.company?.name || 'No company';
        return `<article class="contact"><div class="person"><div class="avatar">${person.image ? `<img src="${escapeHtml(person.image)}" alt="">` : escapeHtml(initials)}</div><div class="person-info"><div class="person-name">${escapeHtml(name)}</div><div class="person-detail">${escapeHtml(person.email || 'No email')} · ${escapeHtml(company)}</div></div></div><div class="row-actions"><button class="icon-button" type="button" aria-label="Edit ${escapeHtml(name)}" title="Edit" data-action="edit" data-id="${person.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L8 18l-4 1 1-4Z"/></svg></button><button class="icon-button delete" type="button" aria-label="Delete ${escapeHtml(name)}" title="Delete" data-action="delete" data-id="${person.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M8 6V4h8v2m3 0-1 14H6L5 6m4 4v6m6-6v6"/></svg></button></div></article>`;
      }).join('');
    }
    async function apiRequest(url, options = {}) {
      const response = await fetch(url, {
        ...options,
        headers: {
          'Content-Type': 'application/json',
          ...(options.headers || {})
        }
      });

      let data = null;
      try {
        data = await response.json();
      } catch {
        data = null;
      }

      if (!response.ok) {
        throw new Error(data?.message || `Request failed (${response.status})`);
      }

      return data;
    }

    async function loadContacts() {
      hideNotice();
      document.querySelector('#count').textContent = 'Loading contacts…';
      rows.innerHTML = '<div class="empty"><strong>Loading contacts…</strong></div>';

      try {
        const data = await apiRequest(API_URL);
        contacts = data.users || [];
        render();
      } catch (error) {
        document.querySelector('#count').textContent = 'Unable to connect';
        rows.innerHTML = `<div class="empty"><div class="empty-icon">!</div><strong>Couldn’t load contacts</strong><span>${escapeHtml(error.message)}<br>Start the server, then try again.</span><button class="btn secondary" style="margin-top:15px" type="button" id="retry-button">Try again</button></div>`;
        document.querySelector('#retry-button').addEventListener('click', loadContacts);
        showNotice(`Could not load contacts: ${error.message}`, 'error');
      }
    }
    function formValues() {
      return {
        firstName: document.querySelector('#firstName').value.trim(),
        lastName: document.querySelector('#lastName').value.trim(),
        email: document.querySelector('#email').value.trim(),
        phone: document.querySelector('#phone').value.trim(),
        company: { name: document.querySelector('#company').value.trim() }
      };
    }
    function resetForm() {
      form.reset(); editingId = null; clearFormError();
      document.querySelector('#form-heading').textContent = 'Add a contact';
      document.querySelector('#form-subtitle').textContent = 'Add someone new to your directory.';
      cancelButton.hidden = true;
      setFormBusy(false);
    }
    function startEditing(id) {
      const person = contacts.find(item => item.id === id);
      if (!person) return;
      editingId = id; clearFormError(); hideNotice();
      document.querySelector('#firstName').value = person.firstName || '';
      document.querySelector('#lastName').value = person.lastName || '';
      document.querySelector('#email').value = person.email || '';
      document.querySelector('#company').value = person.company?.name || '';
      document.querySelector('#phone').value = person.phone || '';
      document.querySelector('#form-heading').textContent = 'Edit contact';
      document.querySelector('#form-subtitle').textContent = 'Update this contact’s details.';
      cancelButton.hidden = false;
      setFormBusy(false);
      document.querySelector('#firstName').focus();
    }
    form.addEventListener('submit', async event => {
      event.preventDefault(); clearFormError(); hideNotice();
      const values = formValues();
      if (!values.firstName || !values.lastName || !values.email) { showFormError('First name, last name, and email are required.'); return; }
      if (!document.querySelector('#email').checkValidity()) { showFormError('Enter a valid email address.'); return; }
      const wasEditing = editingId !== null;
      const savedName = `${values.firstName} ${values.lastName}`;
      const url = wasEditing ? `${API_URL}/${editingId}` : API_URL;
      setFormBusy(true, wasEditing ? 'Saving…' : 'Adding…');

      try {
        const savedContact = await apiRequest(url, {
          method: wasEditing ? 'PUT' : 'POST',
          body: JSON.stringify(values)
        });

        if (wasEditing) {
          contacts = contacts.map(person => person.id === editingId ? savedContact : person);
        } else {
          contacts.unshift(savedContact);
        }

        resetForm();
        render();
        showNotice(`${savedName} was ${wasEditing ? 'updated' : 'added'} successfully.`);
      } catch (error) {
        setFormBusy(false);
        showFormError(`${wasEditing ? 'Update' : 'Create'} failed: ${error.message}`);
      }
    });
    cancelButton.addEventListener('click', resetForm);
    document.querySelector('#search').addEventListener('input', render);
    rows.addEventListener('click', async event => {
      const button = event.target.closest('button[data-action]');
      if (!button) return;
      const id = Number(button.dataset.id);
      if (button.dataset.action === 'edit') { startEditing(id); return; }
      const person = contacts.find(item => item.id === id);
      if (!person || !window.confirm(`Delete ${person.firstName} ${person.lastName}?`)) return;
      const previousLabel = button.innerHTML;
      button.disabled = true;
      button.innerHTML = '<span class="spinner"></span>';

      try {
        await apiRequest(`${API_URL}/${id}`, { method: 'DELETE' });
        contacts = contacts.filter(item => item.id !== id);
        if (editingId === id) resetForm();
        render();
        showNotice(`${person.firstName} ${person.lastName} was deleted successfully.`);
      } catch (error) {
        button.disabled = false;
        button.innerHTML = previousLabel;
        showNotice(`Delete failed: ${error.message}`, 'error');
      }
    });
    loadContacts();
  </script>
</body>
</html>
